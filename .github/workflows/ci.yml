name: CI Manual Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-manual-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.14.0'

jobs:
  validate:
    name: Manual validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package and environment
        run: pnpm run check:fast

      - name: Build preview scope
        run: pnpm run build:preview

      - name: Test preview scope
        run: pnpm run test:preview

      - name: Lint preview scope
        run: pnpm run lint:preview
